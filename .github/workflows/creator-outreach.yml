name: Creator outreach morning pipeline

# Uses the same entrypoint and mail template as local runs:
#   python3 tools/creator_leads/morning_pipeline.py morning
on:
  schedule:
    # 08:00 IST (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview queue only (do not send)"
        type: boolean
        default: false
      limit:
        description: "Max emails to send this run"
        type: number
        default: 30
      daily_cap:
        description: "Maximum total emails allowed today"
        type: number
        default: 30

permissions:
  contents: read

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore lead database + send log
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/creator_leads/data/creator_leads_master.csv
            tools/creator_leads/data/send_log.csv
          key: creator-leads-data-${{ github.run_id }}
          restore-keys: |
            creator-leads-data-

      - name: Bootstrap outreach state when cache is empty
        if: ${{ hashFiles('tools/creator_leads/data/creator_leads_master.csv', 'tools/creator_leads/data/send_log.csv') == '' }}
        env:
          CREATOR_LEADS_STATE_GZIP_BASE64: ${{ secrets.CREATOR_LEADS_STATE_GZIP_BASE64 }}
          CREATOR_SEND_LOG_GZIP_BASE64: ${{ secrets.CREATOR_SEND_LOG_GZIP_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CREATOR_LEADS_STATE_GZIP_BASE64}" ] || [ -z "${CREATOR_SEND_LOG_GZIP_BASE64}" ]; then
            echo "Missing encrypted outreach-state bootstrap secrets."
            exit 1
          fi
          mkdir -p tools/creator_leads/data
          printf '%s' "${CREATOR_LEADS_STATE_GZIP_BASE64}" | base64 --decode | gzip --decompress > tools/creator_leads/data/creator_leads_master.csv
          printf '%s' "${CREATOR_SEND_LOG_GZIP_BASE64}" | base64 --decode | gzip --decompress > tools/creator_leads/data/send_log.csv

      - name: Require SMTP secret for live sends
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          HOSTINGER_SMTP_PASSWORD: ${{ secrets.HOSTINGER_SMTP_PASSWORD }}
        run: |
          if [ -z "${HOSTINGER_SMTP_PASSWORD}" ]; then
            echo "Add repository secret HOSTINGER_SMTP_PASSWORD (Hostinger mailbox password)."
            exit 1
          fi

      - name: Require deck attachment for live sends
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ ! -f tools/creator_leads/data/TathyaForge_Creator_App_Deck.pdf ]; then
            echo "Missing tools/creator_leads/data/TathyaForge_Creator_App_Deck.pdf"
            echo "The deck must be committed at tools/creator_leads/data/TathyaForge_Creator_App_Deck.pdf."
            exit 1
          fi

      - name: Run morning pipeline
        env:
          HOSTINGER_SMTP_PASSWORD: ${{ secrets.HOSTINGER_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          DAILY_CAP="${{ github.event.inputs.daily_cap || '30' }}"
          ARGS=(morning --limit "$LIMIT" --daily-cap "$DAILY_CAP")
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 tools/creator_leads/morning_pipeline.py "${ARGS[@]}"

      - name: Persist lead database + send log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            tools/creator_leads/data/creator_leads_master.csv
            tools/creator_leads/data/send_log.csv
          key: creator-leads-data-${{ github.run_id }}
